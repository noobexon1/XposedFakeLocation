name: Build & attach release APK

# Triggered when you publish a GitHub Release (with your own notes).
# CI builds the release APK (R8-shrunk), versions it from the release tag, signs it
# with your debug keystore, and attaches XposedFakeLocation.apk to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  APK_NAME: XposedFakeLocation.apk

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. Add it so releases keep a stable signature."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PappVersionName="$TAG"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Check version in APK
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          badging="$("$aapt2" dump badging "$APK_NAME" | head -n 1)"
          version_code="$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [ -z "$version_code" ] || [ "$version_code" = "0" ] || [ -z "$version_name" ]; then
            echo "::error::Could not read a valid version from the APK (got code='$version_code' name='$version_name'). Use tags like v1.2.3."
            exit 1
          fi
          echo "APK version: $version_code-$version_name"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK_NAME" --clobber --repo "$GITHUB_REPOSITORY"
